<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
    <link rel="stylesheet" href="/stylesheet.css">
</head>
<body>

<section class="container">
    <h1>Multiplication Table</h1>
    <h3>Create your own multiplication table that is rendered with an HTML table!</h3>

    <div class="generate-box">
        <div class="inputs">
            <label for="rows" class="rows">Rows:
                <input id="rows" type="number" value="10"  placeholder="How many rows?"/>
            </label>

            <label for="cols">Columns:
                <input id="cols" type="number" value="10"  placeholder="How many columns?"/>
            </label>
            <label for="highlight">Highlight:
                <input id="highlight" type="number">
            </label>
        </div>
        <button id="generate" onclick="createWithHtmlTable(getInputValueAsNumber('rows'), getInputValueAsNumber('cols'), getInputValueAsNumber('highlight'))">&#x1F422</button>
    </div>
    <div id="output"></div>
</section>

</body>
<script src="javascript.js"></script>
</html>
