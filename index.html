<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplication Table</title>
<!--    <link rel="stylesheet" href="stylesheet.css" />-->
    <style>
        section {
            width: 70vw;
            height: 100vh;
            margin: 0 auto;
            color: hotpink;
            border-radius: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 5px skyblue dashed;
            background-color: lavenderblush;
        }

        h1, h3 {
            font-family: "Andale Mono", monospace;
        }

        .generate-box {
            display: flex;
            gap: 10px;
        }

        .generate-box button {
            background-color: hotpink;
            border: none;
            font-size: 300%;
            border-radius: 10px;
            padding: 0 20px;
        }

        .generate-box button:hover {
            background-color: deeppink;
        }

        .generate-box button:active {
            background-color: darkseagreen;
            top: 2px;
        }

        .generate-box .inputs {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .generate-box .inputs label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: hotpink;
        }

        #output {
            display: flex;
            flex-direction: column;
            max-width: fit-content;
            max-height: 60vh;
            overflow: auto;
            padding: 2px;
            background-color: lavenderblush;
            box-sizing: border-box;

        }

        .row {
            display: flex;
        }

        .cell {
            width: 22px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lavenderblush;
            box-sizing: border-box;
            border-top: 1px solid black;
            border-left: 1px solid black;
        }

        .row:last-child .cell {
            border-bottom: 1px solid black;
        }

        .row .cell:last-child {
            border-right: 1px solid black;
        }

        .row:first-child .cell,
        .row:last-child .cell,
        .row .cell:first-child,
        .row .cell:last-child {
            background-color: lightblue;
        }

        .cell.highlight:not(:first-child):not(:last-child),
        .row.highlight .cell:not(:first-child):not(:last-child) {
            background-color: mediumpurple;
            color: white;
        }
        .row:hover .cell:not(.highlight):not(:first-child):not(:last-child) {
            background-color: deepskyblue;
        }
    </style>

</head>

<body>
    <section class="container">
    <h1>Multiplication Table</h1>
    <h3>Create your own multiplication table that is rendered with an HTML table!</h3>

    <div class="generate-box">
        <div class="inputs">
            <label for="rows" class="columns-of-rows">Rows:
                <input id="rows" type="number" value="10" placeholder="How many rows?" />
            </label>

            <label for="cols" class="rows-of-columns">Columns:
                <input id="cols" type="number" value="10" placeholder="How many columns?" />
            </label>

            <label for="highlight">Highlight:
                <input id="highlight" type="number" placeholder="Row or Col to highlight" />
            </label>
        </div>

        <button id="generate" onclick="createWithFlexbox(
            getInputValueAsNumber('rows'),
            getInputValueAsNumber('cols'),
            getInputValueAsNumber('highlight')
        )">🐢</button>
    </div>

    <!-- moved output here -->
    <div id="output"></div>
</section>

<script src="javascript.js"></script>
</body>
</html>
